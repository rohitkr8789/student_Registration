<form id="studentForm">

    <div class="form-group">
        <input type="text" name="fullName" placeholder="Full Name" required>
        <input type="text" name="rollNumber" placeholder="Roll Number" required>
    </div>

    <div class="form-group">
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="contactNumber" placeholder="Contact Number" required>
    </div>

    <div class="form-group">
        <input type="text" name="degree" placeholder="Degree Qualification">
        <input type="text" name="stream" placeholder="Stream">
    </div>

    <div class="form-group">
        <input type="text" name="currentLocation" placeholder="Current Location">
        <input type="text" name="nativeLocation" placeholder="Native Location">
    </div>

    <!-- Image Upload -->
    <div class="upload-section">
        <label>Profile Image</label>
        <div class="drop-zone" id="imageDrop">
            Drag & Drop Image Here or Click
            <input type="file" id="imageInput" name="image" hidden>
        </div>
        <div id="imagePreview"></div>
    </div>

    <!-- Resume Upload -->
    <div class="upload-section">
        <label>Resume (PDF)</label>
        <div class="drop-zone" id="resumeDrop">
            Drag & Drop Resume Here or Click
            <input type="file" id="resumeInput" name="resume" hidden>
        </div>
        <div id="resumeName"></div>
    </div>

    <button type="submit">Submit</button>

</form>
